<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
      //alert is an modal window, meaning that it can't interact with other things on page until this has been resolved

      let age = prompt("What's Your Name?", 'Joe Schmoe');

      alert(`You are ${age} years old!`); // You are 100 years old!
      
      let isBoss = confirm("Are you the boss?");

      alert( isBoss ); // true if OK is pressed
      let message;
      message = 'Hello!';
      alert(message); // shows the variable content
      const MyBirthday = "09.29.2005";
      alert(MyBirthday) //constant value, cannot be changed.
      //testing!!
      let s = "my" + "string";
      alert(s); // mystring, "+" concatenates strings
    </script>
  </body>
</html>
